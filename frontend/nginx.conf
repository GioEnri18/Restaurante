server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso al backend API cuando se despliega el stack completo en Docker
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/media/platillos/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.webp$" {
        root /srv/restaurante;
        types { image/webp webp; }
        try_files $uri @fotos_base_bx;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location @fotos_base_bx {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    location /media/ {
        return 404;
    }

    # Fallback SPA para rutas de React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
