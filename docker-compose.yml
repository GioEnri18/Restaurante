# IMPORTANTE (Seguridad):
# Todas las credenciales deben definirse en el archivo `.env` en la raíz del repositorio
# (crea `.env` localmente con los valores de tu entorno). Docker Compose falla si faltan.
# Las contraseñas usadas dentro de las URL no deben llevar caracteres como @ : / ? # %.
#
# Modos de uso:
#   - Solo base de datos (desarrollo local): docker compose up -d
#   - Stack completo (DB + migraciones + API + frontend): docker compose --profile full up -d --build
#
# Exposición de red del stack completo:
#   - Solo `frontend` (nginx) publica un puerto (HTTP). En producción, el HTTPS lo termina un proxy
#     delante de ese puerto (Caddy, Traefik, el nginx del servidor o el balanceador).
#   - `backend` no publica puertos: se alcanza únicamente por nginx en la red interna.
#   - `postgres` solo escucha en 127.0.0.1 del equipo anfitrión (para desarrollo local);
#     en un servidor de producción elimina por completo su sección `ports`.
#
# Roles de base de datos:
#   - POSTGRES_USER: dueño del esquema; lo usan únicamente las migraciones (servicio `migrator`).
#   - APP_DB_USER: usuario de la API, miembro de pos_app_rol (sin DDL, sin borrar ventas/facturas,
#     auditoría solo INSERT/SELECT). Lo crea/actualiza `migrator` en cada despliegue.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos_restaurante_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en el archivo .env}
      TZ: ${DEFAULT_TIMEZONE:-America/Guatemala}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Define POSTGRES_USER en .env} -d ${POSTGRES_DB:?Define POSTGRES_DB en .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tarea única por despliegue: aplica migraciones como dueño y crea/actualiza el usuario de la API
  migrator:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_restaurante_migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node src/database/migrate.js && node src/database/crearRolApp.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?Define APP_DB_USER (usuario de BD de la API) en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD (16+ caracteres aleatorios) en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET de al menos 32 caracteres aleatorios en .env}

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_restaurante_api
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      # Saltos de proxy confiables. "1" = solo el nginx del frontend: Express toma la última IP de
      # X-Forwarded-For (la que agrega nginx), así un cliente no puede falsificarla con su propio header.
      # Si en producción pones otro proxy HTTPS delante, usa "2".
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # La API se conecta con el usuario de mínimo privilegio, nunca con el dueño del esquema
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATE_ON_START: "false"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET de al menos 32 caracteres aleatorios en .env}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Guatemala}
    # Sin `ports`: la API no es accesible desde fuera de la red de Docker

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: pos_restaurante_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
