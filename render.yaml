# Render Blueprint: Backend Node.js (Express + Sequelize) + PostgreSQL Gestionado
# Uso: en Render Dashboard -> New -> Blueprint -> selecciona este repositorio (GioEnri18/Restaurante)
# Render creará la base de datos PostgreSQL y la API automáticamente.
# Solo te pedirá ingresar el valor de CORS_ORIGIN (la URL de tu frontend en Vercel).

databases:
  - name: pos-restaurante-db
    databaseName: pos_restaurante_gt
    user: pos_admin
    plan: free
    region: oregon

services:
  - type: web
    name: pos-restaurante-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      # Proxy same-origin Vercel (/api/* -> Render): usar 2 saltos (Cliente -> Vercel -> Render -> Express).
      # Si el frontend llama directo a Render sin proxy Vercel, usar "1".
      - key: TRUST_PROXY
        value: "2"
      - key: RATE_LIMIT_STORE
        value: postgres
      - key: RATE_LIMIT_FAIL_OPEN
        value: "true"
      # Disco local en Render es efímero: usar PostgreSQL (platillo_fotos) para persistir fotos de platillos
      - key: MEDIA_STORAGE
        value: db
      - key: MIGRATE_ON_START
        value: "true"
      - key: DB_SSL
        value: auto
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN
        value: "1"
      # Conexión con privilegios de DUEÑO exclusivamente para migraciones (migrate.js / crearRolApp.js)
      - key: DATABASE_MIGRATION_URL
        fromDatabase:
          name: pos-restaurante-db
          property: connectionString
      # Conexión de la API en tiempo de ejecución: apunta al usuario de mínimo privilegio (pos_app_rol)
      # creado con `npm run db:crear-rol-app`. Si el plan gestionado no permite CREATEROLE, puedes
      # enlazar temporalmente el mismo connectionString (la API emitirá una advertencia al arrancar).
      - key: DATABASE_URL
        sync: false
      - key: APP_DB_USER
        value: pos_app
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      # Cookies same-origin (Frontend en Vercel con rewrite /api/* -> Backend en Render).
      # Si llamas a Render desde otro dominio sin rewrite en Vercel, cambia AUTH_COOKIE_SAMESITE a "none".
      - key: AUTH_COOKIE_NAME
        value: pos_session
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: CSRF_PROTECTION_ENABLED
        value: "true"
      # Dominio exacto del frontend en Vercel (ej. https://pos-restaurante-gt.vercel.app)
      - key: CORS_ORIGIN
        sync: false
      # Configuración regional Guatemala
      - key: DEFAULT_TIMEZONE
        value: America/Guatemala
      - key: IVA_RATE
        value: "0.12"
      - key: CURRENCY_CODE
        value: GTQ
      - key: CURRENCY_SYMBOL
        value: Q
      - key: UNIT_OZ_PER_LB
        value: "16"
      - key: ENABLE_TABLE_SERVICE
        value: "false"
      - key: ENABLE_DELIVERY
        value: "false"
      - key: ENABLE_PUBLIC_ORDERS
        value: "false"
      # Controles anti-abuso del portal público (activos cuando ENABLE_PUBLIC_ORDERS=true)
      - key: PUBLIC_ORDERS_MAX_PENDIENTES_POR_TELEFONO
        value: "2"
      - key: PUBLIC_ORDERS_VENTANA_PENDIENTES_MIN
        value: "120"
      - key: PUBLIC_ORDERS_MAX_POR_TELEFONO_DIA
        value: "5"
      - key: PUBLIC_ORDERS_MAX_POR_DIRECCION_DIA
        value: "6"
      - key: PUBLIC_ORDERS_MAX_PENDIENTES_SUCURSAL
        value: "25"
      - key: PUBLIC_ORDERS_MIN_FORM_SECONDS
        value: "3"
      - key: PUBLIC_ORDERS_CAPTCHA_PROVIDER
        value: none
      - key: PUBLIC_ORDERS_CAPTCHA_TIMEOUT_MS
        value: "5000"
      - key: DEFAULT_SERVICE_TYPE
        value: MOSTRADOR
      - key: INVENTARIO_PERMITIR_STOCK_NEGATIVO
        value: "true"
      - key: AUDIT_STOCK_NEGATIVO_ALTO_OZ
        value: "16"
      - key: ALLOW_SEED_IN_PRODUCTION
        value: "false"
